# 6-week 5k plan
# Built for: a slow-but-experienced cyclist, running for ~2 weeks so far,
# currently able to run 2min @ EasyPace with a 1min walk recovery.
# Race: Sunday, Oct 11, 2026 (5k)
#
# Design notes:
# - Progression is run/walk based (extend the run segment, hold the walk
#   segment) until continuous running is established (week 4), then it
#   becomes a distance/duration build, with pace-specific work introduced
#   only once, from week 5, and never faster than TargetPace.
# - Only ever one harder/pace-specific session per week; the other two
#   sessions in that week stay at EasyPace.
# - Every step is a single duration-or-distance + single pace, so it
#   imports cleanly as a structured workout (e.g. into Garmin Connect).
# - Weeks 1-3 vary the interval shape session-to-session (more reps, less
#   recovery, or longer efforts in turn) so every session feels like a
#   small step up rather than three identical repeats of the same workout.

definitions:
  EasyPace: "7:45-8:15"
  TargetPace: "7:00-7:30"

workouts:
  # WEEK 1 - two sessions, second nudges up via one extra rep (same interval
  # difficulty, just "one more than last time" - the gentlest possible
  # felt-progress marker)
  w1a_runwalk:
    - warmup: 5min
    - repeat(6):
        - run: 2min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w1b_runwalk:
    - warmup: 5min
    - repeat(7):
        - run: 2min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  # WEEK 2 - each session varies a different axis: interval length, then
  # recovery length, then interval length again
  w2a_runwalk:
    - warmup: 5min
    - repeat(5):
        - run: 3min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w2b_runwalk_shortrest:
    - warmup: 5min
    - repeat(5):
        - run: 3min @P($EasyPace)
        - recovery: 45sec
    - cooldown: 5min

  w2c_runwalk:
    - warmup: 5min
    - repeat(4):
        - run: 4min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  # WEEK 3 - shorter recovery again, then longer single efforts, then a
  # finisher that previews week 4's continuous running with an unbroken
  # 8min close
  w3a_runwalk_shortrest:
    - warmup: 5min
    - repeat(4):
        - run: 4min @P($EasyPace)
        - recovery: 45sec
    - cooldown: 5min

  w3b_runwalk_long:
    - warmup: 5min
    - repeat(3):
        - run: 5min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w3c_runwalk_finisher:
    - warmup: 5min
    - repeat(2):
        - run: 6min @P($EasyPace)
        - recovery: 1min
    - run: 8min @P($EasyPace)
    - cooldown: 5min

  # WEEK 4 - transition from intervals to continuous running
  w4_runwalk_long:
    - warmup: 5min
    - repeat(3):
        - run: 8min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w4_continuous_20min:
    - warmup: 5min
    - run: 20min @P($EasyPace)
    - cooldown: 5min

  w4_continuous_3k:
    - warmup: 5min
    - run: 3000m @P($EasyPace)
    - cooldown: 5min

  # WEEK 5 - build distance, first (and only) taste of race pace
  w5_continuous_3_5k:
    - warmup: 5min
    - run: 3500m @P($EasyPace)
    - cooldown: 5min

  w5_pace_reps:
    - warmup: 5min
    - repeat(3):
        - run: 500m @P($TargetPace)
        - recovery: 2min
    - cooldown: 5min

  w5_continuous_4k:
    - warmup: 5min
    - run: 4000m @P($EasyPace)
    - cooldown: 5min

  # WEEK 6 - taper
  w6_taper_2k:
    - warmup: 5min
    - run: 2000m @P($TargetPace)
    - cooldown: 5min

  w6_shakeout:
    - warmup: 5min
    - run: 15min @P($EasyPace)
    - cooldown: 5min

  w6_5k_race_day:
    - warmup: 10min
    - run: 5000m @P($TargetPace)

schedulePlan:
  start_from: "2026-09-02"  # Wednesday, Sep 2, 2026
  end_on: "2026-10-11"      # Sunday, Oct 11, 2026 (race day)
  training_days: [Monday, Wednesday, Saturday]
  max_sessions_per_week: 3
  if_missed: "skip the session - do not stack two quality sessions back to back"
  optional_cross_train: "easy 30-45min conversational-pace cycling on any rest day - doesn't count toward the 3-session cap, aids aerobic base without adding running impact"
  workouts:
    # Week 1 (partial: Wed-Sat, plan starts mid-week) - 2 sessions
    - w1a_runwalk          # Wed, Sep 2   [run: 12min]
    - rest                 # Thu, Sep 3
    - rest                 # Fri, Sep 4
    - w1b_runwalk          # Sat, Sep 5   [run: 14min - 1 extra rep]
    - rest                 # Sun, Sep 6

    # Week 2 (Mon Sep 7 - Sat Sep 12) - 3 sessions
    - w2a_runwalk          # Mon, Sep 7   [run: 15min, longer intervals]
    - rest                 # Tue, Sep 8
    - w2b_runwalk_shortrest # Wed, Sep 9  [run: 15min, less rest between reps]
    - rest                 # Thu, Sep 10
    - rest                 # Fri, Sep 11
    - w2c_runwalk          # Sat, Sep 12  [run: 16min, longer intervals again]
    - rest                 # Sun, Sep 13

    # Week 3 (Mon Sep 14 - Sat Sep 19) - 3 sessions
    - w3a_runwalk_shortrest # Mon, Sep 14 [run: 16min, less rest]
    - rest                  # Tue, Sep 15
    - w3b_runwalk_long      # Wed, Sep 16 [run: 15min, 5min efforts]
    - rest                  # Thu, Sep 17
    - rest                  # Fri, Sep 18
    - w3c_runwalk_finisher  # Sat, Sep 19 [run: 20min, closes w/ 8min unbroken]
    - rest                  # Sun, Sep 20

    # Week 4 (Mon Sep 21 - Sat Sep 26) - 3 sessions, transition to continuous
    - w4_runwalk_long       # Mon, Sep 21
    - rest                  # Tue, Sep 22
    - w4_continuous_20min   # Wed, Sep 23  <- first continuous run
    - rest                  # Thu, Sep 24
    - rest                  # Fri, Sep 25
    - w4_continuous_3k      # Sat, Sep 26
    - rest                  # Sun, Sep 27

    # Week 5 (Mon Sep 28 - Sat Oct 3) - 3 sessions
    - w5_continuous_3_5k    # Mon, Sep 28
    - rest                  # Tue, Sep 29
    - w5_pace_reps          # Wed, Sep 30  <- only pace-specific session in the plan
    - rest                  # Thu, Oct 1
    - rest                  # Fri, Oct 2
    - w5_continuous_4k      # Sat, Oct 3   <- longest run before taper
    - rest                  # Sun, Oct 4

    # Week 6 (Race week: Mon Oct 5 - Sun Oct 11) - taper, 2 sessions + race
    - w6_taper_2k           # Mon, Oct 5
    - rest                  # Tue, Oct 6
    - w6_shakeout           # Wed, Oct 7
    - rest                  # Thu, Oct 8
    - rest                  # Fri, Oct 9
    - rest                  # Sat, Oct 10   (extra rest day before race)
    - w6_5k_race_day        # Sun, Oct 11