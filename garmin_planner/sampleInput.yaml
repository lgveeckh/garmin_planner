settings:
  deleteSameNameWorkout: true

definitions:
  EasyPace: "7:45-8:15"
  TargetPace: "7:00-7:30"
  SurgePace: "6:45-7:15"

workouts:
  # PHASE 1: AEROBIC ADAPTATION (WEEKS 1-3)
  w1_interval:
    - warmup: 5min
    - repeat(10):
        - run: 1min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w1_long_interval:
    - warmup: 5min
    - repeat(6):
        - run: 2min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w2_interval:
    - warmup: 5min
    - repeat(8):
        - run: 90sec @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w2_long_interval:
    - warmup: 5min
    - repeat(5):
        - run: 3min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w3_interval:
    - warmup: 5min
    - repeat(6):
        - run: 3min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w3_pace_work:
    - warmup: 5min
    - repeat(4):
        - run: 4min @P($TargetPace)
        - recovery: 90sec
    - cooldown: 5min

  w3_continuous_2_5k:
    - warmup: 5min
    - run: 2500m @P($EasyPace)
    - cooldown: 5min

  # PHASE 2: CONTINUOUS DISTANCE & TARGET PACE (WEEKS 4-6)
  w4_pace_intervals:
    - warmup: 5min
    - repeat(3):
        - run: 1000m @P($TargetPace)
        - recovery: 2min
    - cooldown: 5min

  w4_easy_20min:
    - warmup: 5min
    - run: 20min @P($EasyPace)
    - cooldown: 5min

  w4_continuous_3_5k:
    - warmup: 5min
    - run: 3500m @P($EasyPace)
    - cooldown: 5min

  w5_speed_endurance:
    - warmup: 5min
    - repeat(4):
        - run: 800m @P($SurgePace)
        - recovery: 90sec
    - cooldown: 5min

  w5_easy_25min:
    - warmup: 5min
    - run: 2500m @P($EasyPace)
    - cooldown: 5min

  w5_continuous_4_2k:
    - warmup: 5min
    - run: 4200m @P($TargetPace)
    - cooldown: 5min

  w6_taper_2k:
    - warmup: 5min
    - run: 2000m @P($TargetPace)
    - cooldown: 5min

  w6_shakeout:
    - warmup: 5min
    - run: 15min @P($EasyPace)
    - cooldown: 5min

  w6_5k_race_day:
    - run: 5000m @P($TargetPace)

schedulePlan:
  start_from: "2026-09-02" # Starts Monday, Aug 31 -> Ends Monday, Oct 12
  workouts:
    # Week 1
    - w1_interval       # Thu, Sep 3
    - rest
    - w1_long_interval  # Sun, Sep 6
    - rest
    - rest

    # Week 2
    - w2_interval       # Tue, Sep 8
    - rest
    - w2_interval       # Thu, Sep 10
    - rest
    - w2_long_interval  # Sun, Sep 13
    - rest
    - rest

    # Week 3
    - w3_interval       # Tue, Sep 15
    - rest
    - w3_pace_work      # Thu, Sep 17
    - rest
    - w3_continuous_2_5k # Sun, Sep 20
    - rest
    - rest

    # Week 4
    - w4_pace_intervals # Tue, Sep 22
    - rest
    - w4_easy_20min     # Thu, Sep 24
    - rest
    - w4_continuous_3_5k # Sun, Sep 27
    - rest
    - rest

    # Week 5
    - w5_speed_endurance # Tue, Sep 29
    - rest
    - w5_easy_25min      # Thu, Oct 1
    - rest
    - w5_continuous_4_2k # Sun, Oct 4
    - rest
    - rest

    # Week 6 (Race Week)
    - rest
    - w6_taper_2k       # Tue, Oct 6
    - rest
    - rest
    - w6_shakeout       # Thu, Oct 8
    - rest
    - w6_5k_race_day    # Mon, Oct 12 (Scheduled for target date!)