definitions:
  EasyPace: "7:45-8:15"
  TargetPace: "7:00-7:30"

workouts:
  # PHASE 1: AEROBIC ADAPTATION (WEEKS 1-3)
  w1_interval:
    - warmup: 5min
    - repeat(10):
        - run: 1min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w1_long_interval:
    - warmup: 5min
    - repeat(6):
        - run: 2min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w2_interval:
    - warmup: 5min
    - repeat(8):
        - run: 90sec @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w2_long_interval:
    - warmup: 5min
    - repeat(5):
        - run: 3min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w3_interval:
    - warmup: 5min
    - repeat(6):
        - run: 3min @P($EasyPace)
        - recovery: 1min
    - cooldown: 5min

  w3_pace_work:
    - warmup: 5min
    - repeat(4):
        - run: 3min @P($EasyPace)
        - recovery: 45sec
    - repeat(2):
        - run: 30sec @P($TargetPace)
        - recovery: 90sec
    - cooldown: 5min

  w3_continuous_2_5k:
    - warmup: 5min
    - run: 2500m @P($EasyPace)
    - cooldown: 5min

  # PHASE 2: CONTINUOUS DISTANCE & TARGET PACE (WEEKS 4-6)
  w4_pace_intervals:
    - warmup: 5min
    - repeat(3):
        - run: 1000m @P($TargetPace)
        - recovery: 2min
    - cooldown: 5min

  w4_easy_20min:
    - warmup: 5min
    - run: 20min @P($EasyPace)
    - cooldown: 5min

  w4_continuous_3_5k:
    - warmup: 5min
    - run: 3500m @P($EasyPace)
    - cooldown: 5min

  w5_tempo_reps:
    # Replaces the old surge-pace (faster-than-race-pace) session, which is
    # too demanding for a runner still in their first two months of running.
    # Same purpose (a bit of quality mid-week) but capped at TargetPace.
    - warmup: 5min
    - repeat(3):
        - run: 500m @P($TargetPace)
        - recovery: 2min
    - cooldown: 5min

  w5_easy_4k:
    # NEW: bridges the old jump from 3.5k-easy straight to 4k-at-target-pace.
    # Same distance as the pace workout below, but at EasyPace, so the
    # runner has already covered 4k continuously before doing it at speed.
    - warmup: 5min
    - run: 4000m @P($EasyPace)
    - cooldown: 5min

  w5_continuous_4k:
    - warmup: 5min
    - run: 4000m @P($TargetPace)
    - cooldown: 5min

  w6_taper_2k:
    - warmup: 5min
    - run: 2000m @P($TargetPace)
    - cooldown: 5min

  w6_shakeout:
    - warmup: 5min
    - run: 15min @P($EasyPace)
    - cooldown: 5min

  w6_5k_race_day:
    - warmup: 10min
    - run: 5000m @P($TargetPace)

schedulePlan:
  start_from: "2026-09-02"  # Wednesday, Sep 2, 2026
  end_on: "2026-10-11"      # Sunday, Oct 11, 2026 (race day)
  training_days: [Monday, Wednesday, Saturday]
  max_sessions_per_week: 3
  if_missed: "skip the session - do not stack two quality sessions back to back"
  workouts:
    # Week 1 (partial: Wed-Sat, no Monday since plan starts mid-week) - 2 sessions
    - w1_interval          # Wed, Sep 2  (below current ability - easy re-entry)
    - rest                 # Thu, Sep 3
    - rest                 # Fri, Sep 4
    - w1_long_interval     # Sat, Sep 5  (matches current ability: 2min run/1min walk)
    - rest                 # Sun, Sep 6

    # Week 2 (Mon Sep 7 - Sat Sep 12) - 3 sessions
    - w2_interval          # Mon, Sep 7
    - rest                 # Tue, Sep 8
    - w2_interval          # Wed, Sep 9
    - rest                 # Thu, Sep 10
    - rest                 # Fri, Sep 11
    - w2_long_interval     # Sat, Sep 12
    - rest                 # Sun, Sep 13

    # Week 3 (Mon Sep 14 - Sat Sep 19) - 3 sessions
    - w3_interval          # Mon, Sep 14
    - rest                 # Tue, Sep 15
    - w3_pace_work         # Wed, Sep 16
    - rest                 # Thu, Sep 17
    - rest                 # Fri, Sep 18
    - w3_continuous_2_5k   # Sat, Sep 19
    - rest                 # Sun, Sep 20

    # Week 4 (Mon Sep 21 - Sat Sep 26) - 3 sessions
    - w4_pace_intervals    # Mon, Sep 21
    - rest                 # Tue, Sep 22
    - w4_easy_20min        # Wed, Sep 23
    - rest                 # Thu, Sep 24
    - rest                 # Fri, Sep 25
    - w4_continuous_3_5k   # Sat, Sep 26
    - rest                 # Sun, Sep 27

    # Week 5 (Mon Sep 28 - Sat Oct 3) - 3 sessions
    - w5_tempo_reps        # Mon, Sep 28  (moderate quality, not surge pace)
    - rest                 # Tue, Sep 29
    - w5_easy_4k           # Wed, Sep 30  <- bridges to target-pace 4k
    - rest                 # Thu, Oct 1
    - rest                 # Fri, Oct 2
    - w5_continuous_4k     # Sat, Oct 3
    - rest                 # Sun, Oct 4

    # Week 6 (Race week: Mon Oct 5 - Sun Oct 11) - 2 taper sessions + race
    - w6_taper_2k          # Mon, Oct 5
    - rest                 # Tue, Oct 6
    - w6_shakeout          # Wed, Oct 7
    - rest                 # Thu, Oct 8
    - rest                 # Fri, Oct 9
    - w6_5k_race_day       # Sat, Oct 10 (race)